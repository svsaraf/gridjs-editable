<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grid.js Pokemon Example</title>
    <link rel="stylesheet" href="../dist/theme/mermaid.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f8fb;
        color: #172033;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 700;
      }

      p {
        margin: 0 0 24px;
        color: #516070;
      }

      #pokemon-grid {
        background: #ffffff;
        border: 1px solid #dfe5ec;
        border-radius: 8px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Top 20 Pokemon</h1>
      <p>A local Grid.js example using the built files from this repository.</p>
      <div id="pokemon-grid"></div>
    </main>

    <script src="../dist/gridjs.umd.js"></script>
    <script>
      new gridjs.Grid({
        columns: [
          { name: "#", width: "72px" },
          "Pokemon",
          "Type",
          { name: "HP", width: "90px" },
          { name: "Attack", width: "110px" },
          { name: "Speed", width: "100px" }
        ],
        data: [
          [1, "Bulbasaur", "Grass / Poison", 45, 49, 45],
          [2, "Ivysaur", "Grass / Poison", 60, 62, 60],
          [3, "Venusaur", "Grass / Poison", 80, 82, 80],
          [4, "Charmander", "Fire", 39, 52, 65],
          [5, "Charmeleon", "Fire", 58, 64, 80],
          [6, "Charizard", "Fire / Flying", 78, 84, 100],
          [7, "Squirtle", "Water", 44, 48, 43],
          [8, "Wartortle", "Water", 59, 63, 58],
          [9, "Blastoise", "Water", 79, 83, 78],
          [10, "Caterpie", "Bug", 45, 30, 45],
          [11, "Metapod", "Bug", 50, 20, 30],
          [12, "Butterfree", "Bug / Flying", 60, 45, 70],
          [13, "Weedle", "Bug / Poison", 40, 35, 50],
          [14, "Kakuna", "Bug / Poison", 45, 25, 35],
          [15, "Beedrill", "Bug / Poison", 65, 90, 75],
          [16, "Pidgey", "Normal / Flying", 40, 45, 56],
          [17, "Pidgeotto", "Normal / Flying", 63, 60, 71],
          [18, "Pidgeot", "Normal / Flying", 83, 80, 101],
          [19, "Rattata", "Normal", 30, 56, 72],
          [20, "Raticate", "Normal", 55, 81, 97]
        ],
        search: true,
        sort: true,
        pagination: {
          limit: 10
        }
      }).render(document.getElementById("pokemon-grid"));
    </script>
  </body>
</html>
